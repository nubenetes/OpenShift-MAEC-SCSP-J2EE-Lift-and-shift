---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scsp-pre-sync
  namespace: openshift-gitops
  labels:
    environment: pre
    app.kubernetes.io/name: scsp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/nubenetes/OpenShift-MAEC-SCSP-J2EE-Lift-and-shift.git'
    targetRevision: main
    path: solution-a-gitops/kustomize/overlays/pre
  destination:
    # En modelo multi-clúster, apunta a la API del clúster OCP de PRE en NubeSARA
    server: 'https://api.ocp-pre.nubesara.local:6443'
    namespace: maec-scsp-pre
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
